[build-system]
requires = ["setuptools>=68.0,<69", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-governed"
version = "0.1.0"
description = "Governed memory provider plugin for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
vector = [
    "lancedb>=0.17,<1",
    "pyarrow>=14",
    "fastembed>=0.3,<1",
    "sentence-transformers>=2.0,<4",
]
dev = [
    "pytest>=8.0,<9",
]

[project.entry-points."hermes.memory_provider"]
governed = "plugin.memory_governed:register"

[tool.setuptools.packages.find]
include = ["plugin*", "scripts*"]
