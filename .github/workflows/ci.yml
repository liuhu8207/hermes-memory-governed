name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "py${{ matrix.python-version }} · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 核心依赖：不装向量后端，验证 importorskip 降级路径
          - python-version: "3.10"
            name: core
            install: ".[dev]"
          - python-version: "3.13"
            name: core
            install: ".[dev]"
          # 向量依赖：只装轻量后端（lancedb + pyarrow + fastembed），
          # 不装 sentence-transformers（会拖 torch ~2GB，CI 极慢且非首选路径）。
          # 这是代码 backend=auto 的真实首选链路（ONNX，无 torch）。
          - python-version: "3.10"
            name: vector
            install: ".[dev] lancedb>=0.17,<1 pyarrow>=14 fastembed>=0.3,<1"
          - python-version: "3.13"
            name: vector
            install: ".[dev] lancedb>=0.17,<1 pyarrow>=14 fastembed>=0.3,<1"
    env:
      # 向量后端首次会下载 ONNX 模型。禁用 xet 存储后端，避免 HF 的 xet CDN
      # 在部分环境返回 401（本地国内网络才需要 HF_ENDPOINT 镜像，CI runner
      # 在海外，直连 huggingface.co 更快，故不设镜像）。
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.install }}

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Run tests
        run: python -m pytest tests/ -q
