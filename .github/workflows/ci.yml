name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -------------------------------------------------------------------------
  # 静默吞异常护栏：独立 job，**零依赖**（只用标准库），20 秒内出结果。
  #
  # 为什么独立成一个 job：这套护栏此前**只活在 pytest 里**，另有
  # ``scripts/silent_ok_audit.py`` 这个命令行审计器却**没有任何调用方** ——
  # 没人跑的检查等于不存在（棘轮曾整轮红着没人发现）。现在它是 CI 的**第一道
  # 闸门**，``test`` job 用 ``needs`` 显式依赖它：审计红了就根本跑不到测试。
  #
  # 判定逻辑不在脚本里另写一份：``guardrail_rules.py`` 与 pytest 闸门共用
  # （改一次两边同步）。``--check`` 非零即本 job 红。
  # -------------------------------------------------------------------------
  guardrail:
    name: "guardrail · silent-ok audit"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit "# silent-ok:" exemptions (blocking)
        run: python scripts/silent_ok_audit.py --check

  test:
    name: "py${{ matrix.python-version }} · ${{ matrix.name }}"
    needs: guardrail
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 核心依赖：不装向量后端，验证 importorskip 降级路径
          - python-version: "3.10"
            name: core
            install: ".[dev]"
          - python-version: "3.13"
            name: core
            install: ".[dev]"
          # 向量依赖：只装轻量后端（lancedb + pyarrow + fastembed），
          # 不装 sentence-transformers（会拖 torch ~2GB，CI 极慢且非首选路径）。
          # 这是代码 backend=auto 的真实首选链路（ONNX，无 torch）。
          - python-version: "3.10"
            name: vector
            install: |
              .[dev]
              lancedb>=0.17,<1
              pyarrow>=14
              fastembed>=0.3,<1
          - python-version: "3.13"
            name: vector
            install: |
              .[dev]
              lancedb>=0.17,<1
              pyarrow>=14
              fastembed>=0.3,<1
    env:
      # 向量后端首次会下载 ONNX 模型。禁用 xet 存储后端，避免 HF 的 xet CDN
      # 在部分环境返回 401（本地国内网络才需要 HF_ENDPOINT 镜像，CI runner
      # 在海外，直连 huggingface.co 更快，故不设镜像）。
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        env:
          # matrix.install 是 YAML 多行字符串（含 < 等特殊字符），
          # 必须经 env 中转（防注入）+ IFS= read 行（防单词拆分），
          # 配合 awk 去掉 YAML 缩进产生的前导空格，
          # 才能让 pip 正确按行解析多个 requirement。
          INSTALL_SPEC: ${{ matrix.install }}
        run: |
          python -m pip install --upgrade pip
          echo "$INSTALL_SPEC" | awk '{$1=$1; print}' | while IFS= read -r req; do
            [ -z "$req" ] && continue
            python -m pip install "$req"
          done

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Run tests
        run: python -m pytest tests/ -q
